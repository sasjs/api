name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow reads the tree and nothing else.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      # Nothing fails on a vulnerable dependency today. The tree as it stands
      # carries 42 advisories, all of them in devDependencies (7 low, 35
      # moderate, none high or critical) and none reachable from the published
      # package; gating at low would be red on the day it lands, which blocks
      # every change rather than gating one. So the gate is high, over the whole
      # tree - stricter than production-only, and it fails the moment a high or
      # critical appears anywhere, including in the release toolchain. Issue #8
      # carries the count and the remediation; when it closes, this becomes
      # `--audit-level=low` and nothing else changes.
      - name: No high or critical advisory
        run: npm audit --audit-level=high

      - name: Formatting
        run: npm run lint

      - name: Route table matches the published spec
        run: npm run check:routes

      - name: Typecheck
        run: npx tsc -p tsconfig.json

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: All three builds load
        run: |
          node -e "const a=require('./build/cjs/index.js'); if(a.ROUTES.length!==60) process.exit(1)"
          node --input-type=module -e "import('./build/esm/index.js').then(a=>{if(a.ROUTES.length!==60) process.exit(1)})"
          # the browser artefact is a classic-worker IIFE, so it is loaded the way
          # a worker would: evaluated with `self` in scope, then read off `self`
          node -e "
          const vm=require('node:vm'), fs=require('node:fs');
          const ctx={self:{}}; vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('build/browser.js','utf8'), ctx);
          const api=ctx.self.SASjsApi;
          if(!api || api.ROUTES.length!==60 || typeof api.createDriveService!=='function') process.exit(1);
          "
