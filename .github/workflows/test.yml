name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the workflow reads the tree, and writes one comment - the
# coverage report - on a pull request.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    # Job-level grant for the coverage comment below. A pull request from a fork
    # still receives a read-only token, so that step also guards on the head
    # repository rather than relying on this block alone.
    # `actions: read` is for the coverage baseline artifact this job downloads;
    # the comment endpoints live under issues, so `issues: write` as well.
    permissions:
      contents: read
      actions: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      # tools/viya-capture is its own package - its own lockfile and .npmrc -
      # because it installs @sasjs/adapter to drive a real estate. The root
      # install never sees it, so its tests, its audit and its formatting would
      # otherwise run on no push at all.
      - name: Capture tool: install, test and audit
        run: |
          npm ci --prefix tools/viya-capture
          node --test tools/viya-capture/redact.test.mjs
          npm audit --prefix tools/viya-capture --omit=dev --audit-level=high

      # No high or critical advisory, in any dependency, published or not.
      #
      # The tree carries 36 moderates that cannot be cleared from here: every one
      # is inside the npm tree that @semantic-release/npm bundles, where glob
      # 13.0.6 and minimatch 10.2.5 are affected (fixed in 14.0.2 and 11.0.1) and
      # `overrides` cannot reach a bundled dependency. Issue #8 records that with
      # the evidence; it unblocks when npm ships fixed bundled versions. Until
      # then the gate stays at high - which is stricter than production-only and
      # catches the case that would matter, a high or critical appearing anywhere,
      # including in the release toolchain.
      # What ships is one dependency (@sasjs/lint) and its tree, so this is no
      # longer vacuous: it audits a real production tree at the lowest severity.
      # It needs no exemption today, which is the state to keep.
      - name: No advisory in what ships
        run: npm audit --omit=dev --audit-level=low

      # The step above ignores the moderate class, so a new moderate used to ship
      # silently. Every moderate we carry is listed in scripts/audit-allowlist.json
      # with the reason it is still open; a 37th fails here.
      - name: No new moderate advisory
        run: npm run audit:gate

      - name: Formatting
        run: npm run lint

      - name: Route table matches the published spec
        run: npm run check:routes

      - name: Typecheck
        run: npx tsc -p tsconfig.json

      - name: Test
        run: npm test

      - name: Coverage ratchet's own cases
        if: matrix.node == 22
        run: node --test .github/scripts/coverage-ratchet.test.mjs

      # Rendered from the summary this run just wrote, so the comment cannot
      # disagree with the gate. One leg posts it: two would race on the same
      # comment, and the numbers are the same either way.
      - name: Render the coverage comment
        if: github.event_name == 'pull_request' && matrix.node == 22
        run: node scripts/coverage-comment.mjs --out coverage-comment.md

      - name: Find the coverage baseline
        id: coverage-baseline
        if: github.event_name == 'pull_request' && matrix.node == 22
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The baseline this pull request is measured against, chosen in this
          # order and never by "whatever is newest":
          #
          # 1. the run for the base commit itself - the tree the pull request is
          #    diffed against;
          # 2. a run for a commit the base commit descends from, when the base
          #    commit has none (a stacked pull request, or a baseline run that
          #    has not finished yet). An ancestor is a tree this pull request
          #    extends, so the comparison cannot invent a pass out of someone
          #    else's later work, and the note in the comment names the commit;
          # 3. nothing - the job fails.
          #
          # Listed by workflow, not by artifact name: an unrelated workflow that
          # one day uploads a `coverage-summary` artifact is not a candidate.
          # `|| true`: this endpoint 404s until the workflow exists on the
          # default branch, which is exactly the state of the pull request that
          # introduces it - an empty list is handled below, a failed step is not.
          runs=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/coverage-baseline.yml/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.conclusion == "success") | "\(.head_sha) \(.id)"' \
            2>/dev/null || true)

          run_id=$(echo "$runs" | awk -v sha="$BASE_SHA" '$1 == sha { print $2 }' | head -1)
          source="the baseline published for the base commit ${BASE_SHA}"
          missing=fail

          if [ -z "$run_id" ]; then
            # every published baseline, newest first - not the first ten: main
            # can move many runs past the base commit of a stacked pull request
            for candidate in $(echo "$runs" | awk '{ print $1 }'); do
              # "ahead" means the base commit is ahead of the candidate, so the
              # candidate is an ancestor; "identical" is the same commit
              status=$(gh api \
                "repos/${GITHUB_REPOSITORY}/compare/${candidate}...${BASE_SHA}" \
                --jq '.status' 2>/dev/null || true)
              if [ "$status" = "ahead" ] || [ "$status" = "identical" ]; then
                run_id=$(echo "$runs" | awk -v sha="$candidate" '$1 == sha { print $2 }' | head -1)
                source="the baseline published for ${candidate}, the newest commit the base commit ${BASE_SHA} descends from"
                echo "::warning::No baseline was published for the base commit ${BASE_SHA}. Comparing against ${candidate}, which the base commit descends from."
                break
              fi
            done
          fi

          if [ -z "$run_id" ]; then
            # The pull request that introduces the mechanism has a base commit
            # with no baseline, and cannot get one until this lands. Proven by
            # the workflow file being absent at that commit, and by reading the
            # HTTP status rather than a pipeline's exit code - `gh api` fails on
            # a 404, so a shell that ran with `pipefail` would invert an exit-code
            # test here. The skip retires itself: once the workflow is on the
            # base branch the file is found and a missing baseline fails again.
            probe=$(gh api --include \
              "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/coverage-baseline.yml?ref=${BASE_SHA}" \
              2>/dev/null || true)
            status=$(printf '%s\n' "$probe" | awk 'NR == 1 { print $2 }')

            if [ "$status" = "404" ]; then
              missing=skip
              echo "::warning::The base commit ${BASE_SHA} predates the coverage-baseline workflow, so this pull request has nothing to compare against."
            fi
          fi

          echo "run-id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "source=${source}" >> "$GITHUB_OUTPUT"
          echo "missing=${missing}" >> "$GITHUB_OUTPUT"

      - name: Download the coverage baseline
        # fails the job when there is nothing to download: a missing baseline is
        # a broken gate, and the step that notices should be this one rather
        # than a green tick with a warning buried in the log
        if: github.event_name == 'pull_request' && matrix.node == 22 && steps.coverage-baseline.outputs.run-id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh run download ${{ steps.coverage-baseline.outputs.run-id }}
          --name coverage-summary
          --dir coverage-base

      - name: Ratchet the coverage
        id: ratchet
        # continue-on-error so the comment below is posted either way; the
        # "Fail on a coverage regression" step turns the outcome into the job's
        # result. See the script's header for why the comparison is the gate.
        continue-on-error: true
        if: github.event_name == 'pull_request' && matrix.node == 22
        run: >-
          node .github/scripts/coverage-ratchet.mjs
          --head coverage/coverage-summary.json
          --base coverage-base/coverage-summary.json
          --markdown coverage-ratchet.md
          --missing-baseline ${{ steps.coverage-baseline.outputs.missing }}
          --note "Compared against ${{ steps.coverage-baseline.outputs.source }}."

      - name: Add the ratchet to the coverage comment
        # one comment per pull request: the report from the run that just
        # happened, then whether it went backwards. The ratchet's own marker is
        # dropped because the comment is found by the report's marker.
        if: github.event_name == 'pull_request' && matrix.node == 22 && hashFiles('coverage-ratchet.md') != ''
        run: |
          printf '\n' >> coverage-comment.md
          grep -v '^<!-- coverage-ratchet -->$' coverage-ratchet.md >> coverage-comment.md

      - name: Post the coverage comment
        if: github.event_name == 'pull_request' && matrix.node == 22 && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs')
            // the marker is how the next run finds this comment again, so a
            // rebased or amended head updates one comment instead of stacking
            const marker = '<!-- coverage-report -->'
            const body =
              marker + '\n' + fs.readFileSync('coverage-comment.md', 'utf8')
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            )
            const existing = comments.find(
              (comment) => comment.body && comment.body.includes(marker)
            )
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              })
            }

      - name: Fail on a coverage regression
        if: github.event_name == 'pull_request' && matrix.node == 22 && steps.ratchet.outcome != 'success'
        run: |
          echo "::error::The coverage ratchet did not pass - see the coverage comment."
          exit 1

      - name: Build
        run: npm run build

      - name: The app stream works from the browser bundle
        run: npm run check:appstream

      - name: All three builds load
        run: |
          node -e "const a=require('./build/cjs/index.js'); if(a.ROUTES.length!==61) process.exit(1)"
          node --input-type=module -e "import('./build/esm/index.js').then(a=>{if(a.ROUTES.length!==61) process.exit(1)})"
          # the browser artefact is a classic-worker IIFE, so it is loaded the way
          # a worker would: evaluated with `self` in scope, then read off `self`
          node -e "
          const vm=require('node:vm'), fs=require('node:fs');
          const ctx={self:{}}; vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('build/browser.js','utf8'), ctx);
          const api=ctx.self.SASjsApi;
          if(!api || api.ROUTES.length!==61 || typeof api.createDriveService!=='function') process.exit(1);
          "
